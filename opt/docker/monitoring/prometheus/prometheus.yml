global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # reached via the docker host gateway rather than by service name.
  - job_name: "node"
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # ---------------------------------------------------------------------------
  # Connectivity probes (blackbox-exporter, host network, host port 9115).
  # Every job below uses the same relabeling: the target in static_configs is
  # what gets probed, the scrape itself goes to the exporter.
  # ---------------------------------------------------------------------------

  # Separate "server NIC / cable / switch" problems from "ISP" problems.
  - job_name: "ping-gateway"
    metrics_path: /probe
    params:
      module: [icmp]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/gateway.yml"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: host.docker.internal:9115

  # Contact internet by IP (no DNS involved)
  - job_name: "ping-internet"
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets: ["1.1.1.1", "8.8.8.8"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: host.docker.internal:9115

  # Contact external DNS server (bypasses AdGuard)
  - job_name: "dns-external"
    metrics_path: /probe
    params:
      module: [dns_a]
    static_configs:
      - targets: ["1.1.1.1:53"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: host.docker.internal:9115

  # Contact AdGuard
  - job_name: "dns-adguard"
    metrics_path: /probe
    params:
      module: [dns_a]
    static_configs:
      - targets: ["127.0.0.1:53"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: host.docker.internal:9115

  # Full HTTPS request to the internet.
  - job_name: "http-external"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["https://www.cloudflare.com/cdn-cgi/trace"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: host.docker.internal:9115

  # Contact internal server services. Probed on localhost, so this
  # works even if the NIC is dead ()
  - job_name: "svc-tcp"
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["127.0.0.1:22"]
        labels:
          service: ssh
      - targets: ["127.0.0.1:8080"]
        labels:
          service: nextcloud
      - targets: ["127.0.0.1:25565"]
        labels:
          service: minecraft
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: host.docker.internal:9115
