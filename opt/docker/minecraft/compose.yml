services:
  mc:
    image: itzg/minecraft-server
    tty: true
    stdin_open: true
    environment:
      EULA: "true"
      TYPE: PAPER
      VERSION: "26.2"
      MEMORY: 6G
      SEED: "CUSTOM_SEED"
    ports:
      - "MC_PORT1:MC_PORT2"
    volumes:
      - /srv/minecraft:/data
    restart: unless-stopped